name: APPISHOWDRIVE checks
on:
  push:
    branches: [main, appishowdrive]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test test/assets/twitch_tunnel_test.cjs
      - run: node --test packaging/test/*.test.mjs
      - run: flutter test
        working-directory: packages/on_device_tts
